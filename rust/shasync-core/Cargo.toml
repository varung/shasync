[package]
name = "shasync-core"
version = "0.1.0"
edition = "2021"
description = "Library port of shasync: content-addressed, end-to-end encrypted folder sync, byte-compatible with the Go CLI"
license = "MIT"
publish = false

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
futures = "0.3"
getrandom = "0.2"
hex = "0.4"
reflink-copy = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusty-s3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
url = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
